      <a href="#training" class="nav-item" data-view="training">记录训练</a>
      <a href="#diet" class="nav-item" data-view="diet">记录饮食</a>
      <a href="#weight" class="nav-item" data-view="weight">记录体重</a>
      <a href="#goals" class="nav-item" data-view="goals">目标设定</a>
      <a href="#reports" class="nav-item" data-view="reports">历史报表</a>

      <div class="prd-tag" id="prdTag">PRD: F2</div>
    </header>
    <main id="view"></main>
  </div>

  <nav class="tabbar">
    <a href="#dashboard" class="tab active" data-view="dashboard">看板</a>
    <a href="#training" class="tab" data-view="training">训练</a>

<div id="toast" class="toast"></div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">确认</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalOk">确认</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
